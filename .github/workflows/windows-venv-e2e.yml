name: Windows campaign 74848 probes (ephemeral)
on:
  push:
    branches: [wine2e/desktop-74848-windows]
permissions:
  contents: read
jobs:
  mechanisms:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
        timeout-minutes: 2
      - name: Probe dependencies
        shell: pwsh
        timeout-minutes: 3
        run: python -m pip install python-dotenv==1.2.1 PyYAML==6.0.3 psutil==7.2.2 rich==14.3.3 packaging==25.0 httpx==0.28.1 requests==2.32.5 platformdirs==4.9.4 pathspec==0.12.1
      - name: Native mechanisms on unchanged production
        shell: pwsh
        timeout-minutes: 6
        run: |
          python evals/desktop_bug_campaign/windows_probe.py
          python evals/desktop_bug_campaign/windows_receipt_matrix.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        timeout-minutes: 2
        with:
          name: mechanisms
          path: windows-evidence/
  staging:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
        timeout-minutes: 2
      - name: Exact reporter Node
        shell: pwsh
        timeout-minutes: 3
        run: |
          Invoke-WebRequest https://nodejs.org/dist/v22.23.2/node-v22.23.2-win-x64.zip -OutFile "$env:RUNNER_TEMP/node.zip"
          Expand-Archive "$env:RUNNER_TEMP/node.zip" "$env:RUNNER_TEMP/node"
          "$env:RUNNER_TEMP/node/node-v22.23.2-win-x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Fresh dependencies and actual native staging
        shell: pwsh
        timeout-minutes: 13
        run: |
          New-Item -ItemType Directory windows-evidence -Force
          node --version
          npm.cmd ci --no-audit --no-fund *> windows-evidence/npm.log
          $npmCode = $LASTEXITCODE
          "npm_exit=$npmCode"
          if ($npmCode -ne 0) { exit $npmCode }
          node apps/desktop/scripts/stage-native-deps.mjs *> windows-evidence/staging.log
          $stageCode = $LASTEXITCODE
          "staging_exit=$stageCode" | Tee-Object windows-evidence/staging-result.txt
          Get-Content windows-evidence/staging.log
          exit $stageCode
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        timeout-minutes: 2
        with:
          name: staging
          path: windows-evidence/

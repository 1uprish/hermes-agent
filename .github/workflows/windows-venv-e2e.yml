name: Update streaming native Windows A-B proof
on:
  push:
    branches: ['wine2e/104537-output']
permissions:
  contents: read
jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 3
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        timeout-minutes: 3
        with:
          version: '0.9.28'
      - name: Install fixture interpreter
        timeout-minutes: 8
        run: uv sync --locked --python 3.11 --extra dev --extra messaging
      - name: Native handoff A-B and invariants
        timeout-minutes: 6
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $head = git rev-parse HEAD
          $python = (Resolve-Path '.venv/Scripts/python.exe').Path
          & powershell -NoProfile -ExecutionPolicy Bypass -File evals/update_streaming/watchdog.ps1 -Python $python -Receipt "$env:RUNNER_TEMP/head.json" -ExpectedProgressCode 7
          if ($LASTEXITCODE -ne 0) { throw 'HEAD native proof failed' }
          & $python -m pytest tests/hermes_cli/test_update_live_output.py tests/hermes_cli/test_update_hangup_protection.py -o addopts= -q
          if ($LASTEXITCODE -ne 0) { throw 'HEAD invariants failed' }
          git status --short
          git checkout 22c5684b983 -- hermes_cli/update_cmd.py hermes_cli/main_dashboard.py
          & powershell -NoProfile -ExecutionPolicy Bypass -File evals/update_streaming/watchdog.ps1 -Python $python -Receipt "$env:RUNNER_TEMP/base.json" -ExpectedProgressCode 124
          if ($LASTEXITCODE -ne 0) { throw 'BASE discriminator failed' }
          git checkout $head -- hermes_cli/update_cmd.py hermes_cli/main_dashboard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 2
        with:
          name: native-windows-update-output
          path: |
            ${{ runner.temp }}/head.json*
            ${{ runner.temp }}/base.json*
